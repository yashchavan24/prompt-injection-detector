<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 340px; font-family: -apple-system, Arial, sans-serif; background: #0f1117; color: #e6e6e6; margin: 0; padding: 14px; }
  h2 { font-size: 14px; margin: 0 0 10px; }
  .subtitle { font-size: 11px; color: #8b8f9a; margin: -6px 0 10px; }
  textarea { width: 100%; height: 80px; background: #161922; border: 1px solid #262a35; border-radius: 6px; color: #e6e6e6; padding: 8px; font-size: 13px; box-sizing: border-box; resize: vertical; }
  textarea:focus { outline: none; border-color: #4a7dff; }
  button { width: 100%; margin-top: 8px; background: #4a7dff; color: white; border: none; border-radius: 6px; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { background: #3a6aef; }
  button.secondary { background: #1d212c; border: 1px solid #2a2e3a; color: #b7bac2; }
  button.secondary:hover { border-color: #4a7dff; color: #fff; }
  #result { margin-top: 10px; font-size: 12px; display: none; padding: 8px; border-radius: 6px; line-height: 1.5; }
  #result.allow { background: #123524; color: #4ade80; display: block; }
  #result.flag { background: #3a2f0e; color: #fbbf24; display: block; }
  #result.block { background: #3a1414; color: #f87171; display: block; }
  .settings { margin-top: 12px; border-top: 1px solid #262a35; padding-top: 10px; display: none; }
  .settings.open { display: block; }
  .settings label { font-size: 11px; color: #8b8f9a; display: block; margin: 8px 0 4px; }
  .settings input[type=text] { width: 100%; background: #161922; border: 1px solid #262a35; border-radius: 6px; color: #e6e6e6; padding: 6px 8px; font-size: 12px; box-sizing: border-box; }
  .settings .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
  .saved { color: #4ade80; font-size: 11px; margin-top: 6px; display: none; }
</style>
</head>
<body>
  <h2>Prompt Injection Guard</h2>
  <div class="subtitle">Works on ChatGPT, Claude, Gemini, Qwen, DeepSeek, Copilot, Mistral &amp; Grok.</div>
  <textarea id="inputText" placeholder="Paste any prompt to check..."></textarea>
  <button id="checkBtn">Check prompt</button>
  <div id="result"></div>
  <button id="toggleSettings" class="secondary" style="margin-top:10px">Settings</button>
  <div class="settings" id="settings">
    <label>Detector API URL</label>
    <input type="text" id="apiUrl" placeholder="https://prompt-injection-detector-nine.vercel.app">
    <div class="row">
      <input type="checkbox" id="autoCheck">
      <span>Auto-check every prompt before it is sent (intercept on Enter)</span>
    </div>
    <button id="saveBtn" class="secondary">Save settings</button>
    <div class="saved" id="savedMsg">Saved. Reload your AI chat tabs to apply.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
